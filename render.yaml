services:
  - type: web
    name: openlms-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: singapore   # closest to PH — change to oregon/frankfurt if preferred
    plan: free          # upgrade to starter ($7/mo) for always-on
    healthCheckPath: /health
    autoDeploy: true    # redeploy on every push to the branch below
    branch: main
    envVars:
      - key: APP_NAME
        value: OpenLMS
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false     # set manually in Render dashboard (contains password)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false     # e.g. https://openlms-backend.onrender.com/api/v1/auth/google/callback
      - key: JWT_SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "false"
      - key: SMTP_STARTTLS
        value: "true"
      - key: EMAIL_FROM
        sync: false     # e.g. OpenLMS <you@gmail.com>
      - key: FRONTEND_URL
        sync: false     # e.g. https://your-site.netlify.app
      - key: ALLOWED_ORIGINS
        sync: false     # e.g. https://your-site.netlify.app
      - key: MAX_FILE_SIZE_MB
        value: "25"
